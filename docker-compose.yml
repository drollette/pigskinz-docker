services:
  app:
    # Both image and build set: `docker compose up -d` pulls the published
    # image (fast, no local build needed -- amd64 + arm64, see
    # .github/workflows/docker-publish.yml); `docker compose up -d --build`
    # builds from this checkout instead, e.g. if you've changed app code.
    image: ghcr.io/drollette/pigskinz-docker:${IMAGE_TAG:-main}
    build: .
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/pigskinz.db
      ENVIRONMENT_NAME: ${ENVIRONMENT_NAME:-production}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_POOL_NAME: ${POOL_NAME:-Pigskinz}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      NEXT_PUBLIC_LEAGUESAFE_URL: ${LEAGUESAFE_URL:-}
      NEXT_PUBLIC_BUYIN_AMOUNT: ${BUYIN_AMOUNT:-}
      NEXT_PUBLIC_BUYIN_DEADLINE: ${BUYIN_DEADLINE:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      INVITATION_CODE: ${INVITATION_CODE:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    volumes:
      - pigskinz-data:/data
    ports:
      - "${APP_PORT:-3000}:3000"

  backup:
    build: ./backup
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/pigskinz.db
      RCLONE_REMOTE: ${RCLONE_REMOTE:-backup-crypt:pigskinz-backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-45}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
    volumes:
      - pigskinz-data:/data:ro
      # Mounted as a directory (not a single file) so this works even before
      # secrets/rclone.conf exists -- see README for the one-time `rclone
      # config` setup. backup.sh skips the upload step (snapshot still
      # taken) until that file shows up here.
      - ./secrets:/run/secrets:ro

volumes:
  pigskinz-data:
