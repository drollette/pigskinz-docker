name: Build & Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  # A PR's own branch never lives on main, so its image only ever gets the
  # "beta" tag below -- nothing here can overwrite the "main"/"latest"
  # tags a real push produces. Only fires for PRs within this repo, not
  # forks (GITHUB_TOKEN has no package-write permission on a fork PR
  # either way).
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # "beta" is a moving tag -- always the most recently pushed PR's
      # build, so testing an in-flight change is just `docker pull
      # ...:beta` rather than looking up which pr-<N> tag is current.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=beta,enable=${{ github.event_name == 'pull_request' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # linux/arm64 covers Raspberry Pi 4/5, the other home-server target
          # this README recommends -- an amd64-only image here would silently
          # fail to run there.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
